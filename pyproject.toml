[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skinseg"
version = "2.0.0"
description = "Skin lesion segmentation on HAM10000, evaluated by lesion"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pillow", "matplotlib", "torch"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
